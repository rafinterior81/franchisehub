<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FranchiseHub - Demo Standalone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
    </style>
</head>
<body>
    <div id="app"></div>

    <script type="module">
        import React from 'https://esm.sh/react@18.2.0';
        import ReactDOM from 'https://esm.sh/react-dom@18.2.0';
        import { useState } from 'https://esm.sh/react@18.2.0';

        // Simple Icon Components
        const Icon = ({ name, size = 24, className = '' }) => {
            const icons = {
                home: 'M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6',
                store: 'M3 3h18v4H3V3zm0 6h18v12H3V9zm6 4h6v4H9v-4z',
                users: 'M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z',
                settings: 'M12 6V4m0 2a2 2 0 100 4m0-4a2 2 0 110 4m-6 8a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4m6 6v10m6-2a2 2 0 100-4m0 4a2 2 0 110-4m0 4v2m0-6V4',
                menu: 'M4 6h16M4 12h16M4 18h16'
            };
            return React.createElement('svg', {
                width: size,
                height: size,
                viewBox: '0 0 24 24',
                fill: 'none',
                stroke: 'currentColor',
                strokeWidth: 2,
                strokeLinecap: 'round',
                strokeLinejoin: 'round',
                className: className
            }, React.createElement('path', { d: icons[name] || icons.home }));
        };

        // Main App Component
        const App = () => {
            const [activeView, setActiveView] = useState('home');

            return React.createElement('div', { className: 'min-h-screen bg-gray-50' },
                // Header
                React.createElement('header', { className: 'bg-gradient-to-r from-blue-600 to-blue-700 text-white p-4 sticky top-0 z-50 shadow-lg' },
                    React.createElement('div', { className: 'max-w-md mx-auto flex items-center justify-between' },
                        React.createElement('div', null,
                            React.createElement('h1', { className: 'text-xl font-bold' }, 'FranchiseHub'),
                            React.createElement('p', { className: 'text-xs text-blue-100' }, 'Demo Version')
                        ),
                        React.createElement('div', { className: 'w-8 h-8 bg-white text-blue-600 rounded-full flex items-center justify-center font-bold' }, 'F')
                    )
                ),

                // Content
                React.createElement('main', { className: 'max-w-md mx-auto p-4 pb-20' },
                    activeView === 'home' && React.createElement('div', { className: 'space-y-4' },
                        React.createElement('div', { className: 'grid grid-cols-2 gap-3' },
                            React.createElement('div', { className: 'bg-gradient-to-br from-blue-500 to-blue-600 rounded-xl p-4 text-white shadow-lg' },
                                React.createElement('div', { className: 'text-2xl font-bold mb-1' }, 'Rp 456M'),
                                React.createElement('div', { className: 'text-xs opacity-90' }, 'Total Revenue'),
                                React.createElement('div', { className: 'text-xs mt-2' }, '↑ +15.3%')
                            ),
                            React.createElement('div', { className: 'bg-gradient-to-br from-green-500 to-green-600 rounded-xl p-4 text-white shadow-lg' },
                                React.createElement('div', { className: 'text-2xl font-bold mb-1' }, '24'),
                                React.createElement('div', { className: 'text-xs opacity-90' }, 'Total Outlets'),
                                React.createElement('div', { className: 'text-xs mt-2' }, '↑ +8.5%')
                            )
                        ),
                        React.createElement('div', { className: 'bg-white rounded-xl p-4 shadow-md' },
                            React.createElement('h3', { className: 'font-bold mb-3' }, 'Selamat Datang! 👋'),
                            React.createElement('p', { className: 'text-sm text-gray-600' }, 'Ini adalah demo standalone FranchiseHub. Untuk versi lengkap dengan semua fitur, silakan deploy menggunakan panduan deployment.')
                        ),
                        React.createElement('div', { className: 'bg-blue-50 rounded-xl p-4' },
                            React.createElement('h4', { className: 'font-semibold mb-2 text-blue-900' }, '🚀 Cara Deploy:'),
                            React.createElement('ol', { className: 'text-sm text-blue-800 space-y-1 list-decimal ml-4' },
                                React.createElement('li', null, 'Download semua file project'),
                                React.createElement('li', null, 'Install dependencies: npm install'),
                                React.createElement('li', null, 'Deploy ke Vercel: vercel --prod'),
                                React.createElement('li', null, 'Atau baca QUICK_START.md')
                            )
                        )
                    ),

                    activeView === 'outlets' && React.createElement('div', { className: 'space-y-3' },
                        React.createElement('h2', { className: 'text-xl font-bold mb-4' }, 'Outlet Management'),
                        React.createElement('div', { className: 'bg-white rounded-xl p-4 shadow-md' },
                            React.createElement('div', { className: 'font-semibold mb-1' }, 'Gerai Sudirman'),
                            React.createElement('div', { className: 'text-sm text-gray-600 mb-2' }, 'Jakarta Pusat'),
                            React.createElement('span', { className: 'px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs font-semibold' }, 'Active')
                        ),
                        React.createElement('div', { className: 'bg-white rounded-xl p-4 shadow-md' },
                            React.createElement('div', { className: 'font-semibold mb-1' }, 'Gerai BSD'),
                            React.createElement('div', { className: 'text-sm text-gray-600 mb-2' }, 'Tangerang Selatan'),
                            React.createElement('span', { className: 'px-3 py-1 bg-green-100 text-green-700 rounded-full text-xs font-semibold' }, 'Active')
                        )
                    ),

                    activeView === 'users' && React.createElement('div', { className: 'space-y-3' },
                        React.createElement('h2', { className: 'text-xl font-bold mb-4' }, 'User Management'),
                        React.createElement('div', { className: 'bg-white rounded-xl p-4 shadow-md' },
                            React.createElement('p', { className: 'text-center text-gray-600' }, 'Fitur lengkap tersedia di versi deploy')
                        )
                    ),

                    activeView === 'settings' && React.createElement('div', { className: 'space-y-3' },
                        React.createElement('h2', { className: 'text-xl font-bold mb-4' }, 'Settings'),
                        React.createElement('div', { className: 'bg-white rounded-xl p-4 shadow-md' },
                            React.createElement('p', { className: 'text-center text-gray-600' }, 'Fitur lengkap tersedia di versi deploy')
                        )
                    )
                ),

                // Bottom Navigation
                React.createElement('nav', { className: 'fixed bottom-0 left-0 right-0 bg-white border-t shadow-lg max-w-md mx-auto' },
                    React.createElement('div', { className: 'grid grid-cols-4 gap-1 p-2' },
                        React.createElement('button', {
                            onClick: () => setActiveView('home'),
                            className: `flex flex-col items-center gap-1 py-2 rounded-lg ${activeView === 'home' ? 'text-blue-600 bg-blue-50' : 'text-gray-600'}`
                        },
                            React.createElement(Icon, { name: 'home', size: 22 }),
                            React.createElement('span', { className: 'text-xs font-medium' }, 'Home')
                        ),
                        React.createElement('button', {
                            onClick: () => setActiveView('outlets'),
                            className: `flex flex-col items-center gap-1 py-2 rounded-lg ${activeView === 'outlets' ? 'text-blue-600 bg-blue-50' : 'text-gray-600'}`
                        },
                            React.createElement(Icon, { name: 'store', size: 22 }),
                            React.createElement('span', { className: 'text-xs font-medium' }, 'Outlets')
                        ),
                        React.createElement('button', {
                            onClick: () => setActiveView('users'),
                            className: `flex flex-col items-center gap-1 py-2 rounded-lg ${activeView === 'users' ? 'text-blue-600 bg-blue-50' : 'text-gray-600'}`
                        },
                            React.createElement(Icon, { name: 'users', size: 22 }),
                            React.createElement('span', { className: 'text-xs font-medium' }, 'Users')
                        ),
                        React.createElement('button', {
                            onClick: () => setActiveView('settings'),
                            className: `flex flex-col items-center gap-1 py-2 rounded-lg ${activeView === 'settings' ? 'text-blue-600 bg-blue-50' : 'text-gray-600'}`
                        },
                            React.createElement(Icon, { name: 'settings', size: 22 }),
                            React.createElement('span', { className: 'text-xs font-medium' }, 'Settings')
                        )
                    )
                )
            );
        };

        // Render App
        const root = ReactDOM.createRoot(document.getElementById('app'));
        root.render(React.createElement(App));
    </script>
</body>
</html>
